<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Soundboard</title>
	<meta name="theme-color" content="#141010">
	<!-- Its manifest scopes it to this page alone: claiming the whole folder, it would take in every
	     sound's folder below, and phones would refuse to install the sounds as apps of their own -->
	<link rel="manifest" href="manifest.webmanifest">
	<link rel="icon" href="icon-192.png">
	<link rel="apple-touch-icon" href="apple-touch-icon.png">
	<style>
		@font-face {
			font-family: OpenDyslexic;
			font-weight: 700;
			src: url(fonts/OpenDyslexic-Bold.woff);
		}
		body {
			margin: 0;
			min-height: 100vh;
			box-sizing: border-box;
			padding: 8vmin;
			/* Room for the bar pinned to the bottom */
			padding-bottom: calc(8vmin + 5.5rem);
			display: grid;
			align-content: center;
			justify-items: center;
			gap: 12vmin;
			background: #141010;
			color: #e8dcd8;
			font: 700 1.2rem OpenDyslexic, sans-serif;
			letter-spacing: 0.02em;
		}
		.sounds {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 8vmin;
		}
		.sound {
			display: grid;
			justify-items: center;
			gap: 1.2rem;
			color: hsl(var(--hue) 70% 82%);
			text-decoration: none;
			-webkit-tap-highlight-color: transparent;
			/* Pressing and holding opens this page's own options, not the phone's menu or a text selection */
			-webkit-touch-callout: none;
			-webkit-user-select: none;
			user-select: none;
			/* Dragging off a button chooses from its options, rather than scrolling the page */
			touch-action: none;
		}
		/* A small copy of the sound's button, in its color */
		.sound::before {
			content: "";
			width: min(30vmin, 140px);
			aspect-ratio: 1;
			border-radius: 50%;
			background: radial-gradient(circle at 38% 32%, hsl(var(--hue) 100% 68%), hsl(var(--hue) 83% 46%) 45%, hsl(var(--hue) 89% 30%) 100%);
			box-shadow: 0 1vmin 0 hsl(var(--hue) 94% 18%), 0 2vmin 4vmin rgba(0, 0, 0, 0.6), inset 0 -0.6vmin 2vmin rgba(0, 0, 0, 0.35);
		}
		.recent {
			width: min(100%, 34rem);
			font-size: 0.85rem;
		}
		.recent h2 {
			margin: 0 0 1rem;
			font-size: inherit;
			letter-spacing: 0.12em;
			color: #8a7d7a;
		}
		.recordings {
			margin: 0;
			padding: 0;
			list-style: none;
			display: grid;
			gap: 0.6rem;
		}
		.recordings li {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: 0.7rem;
			padding: 0.6rem 0.8rem;
			border-radius: 0.8rem;
			background: #1d1717;
		}
		.when {
			flex: 1;
			color: #b3a5a1;
		}
		button {
			font: inherit;
			letter-spacing: inherit;
			color: inherit;
			background: #2c2323;
			border: none;
			border-radius: 999px;
			padding: 0.45rem 0.9rem;
			cursor: pointer;
			text-decoration: none;
		}
		dialog {
			border: none;
			border-radius: 1.2rem;
			padding: 2rem 2.4rem;
			background: #1d1717;
			color: inherit;
		}
		dialog::backdrop {
			background: rgba(0, 0, 0, 0.65);
		}
		dialog form {
			display: grid;
			justify-items: center;
			gap: 1.4rem;
		}
		dialog input:not([type="range"]) {
			width: 12rem;
			padding: 0.5rem 0.8rem;
			border: 2px solid #3a2f2e;
			border-radius: 0.6rem;
			background: #141010;
			color: inherit;
			font: inherit;
			text-align: center;
		}
		dialog input[name="name"] {
			text-transform: uppercase;
		}
		/* The color, picked off a rainbow */
		dialog input[type="range"] {
			appearance: none;
			width: 14rem;
			height: 0.8rem;
			border-radius: 999px;
			background: linear-gradient(to right, hsl(0 85% 50%), hsl(60 85% 50%), hsl(120 85% 50%), hsl(180 85% 50%), hsl(240 85% 50%), hsl(300 85% 50%), hsl(360 85% 50%));
		}
		dialog input[type="range"]::-webkit-slider-thumb {
			appearance: none;
			width: 1.5rem;
			aspect-ratio: 1;
			border-radius: 50%;
			background: #e8dcd8;
		}
		dialog input[type="range"]::-moz-range-thumb {
			width: 1.5rem;
			height: 1.5rem;
			border: none;
			border-radius: 50%;
			background: #e8dcd8;
		}
		.problem {
			max-width: 16rem;
			margin: 0;
			text-align: center;
			font-size: 0.8rem;
			color: hsl(3 90% 72%);
		}
		.bar {
			position: fixed;
			left: 50%;
			bottom: max(1.2rem, env(safe-area-inset-bottom));
			translate: -50% 0;
			display: flex;
			align-items: center;
			gap: 0.8rem;
			font-size: 0.8rem;
			white-space: nowrap;
		}
		.bar button {
			color: #b3a5a1;
		}
		.divider {
			width: 2px;
			height: 1.6rem;
			border-radius: 1px;
			background: rgba(232, 220, 216, 0.12);
		}
		/* A studio's red dot, held to record. The ring round it fills with the time used (--taken) */
		.record {
			width: 3.6rem;
			aspect-ratio: 1;
			padding: 0;
			border-radius: 50%;
			background: radial-gradient(circle closest-side, hsl(3 85% 52%) 60%, transparent 63%), conic-gradient(hsl(3 90% 80%) calc(var(--taken, 0) * 360deg), #2c2323 0);
			touch-action: none;
			-webkit-touch-callout: none;
		}
		.record.recording {
			animation: listening 0.8s ease-in-out infinite alternate;
		}
		@keyframes listening {
			to {
				box-shadow: 0 0 1.6rem hsl(3 90% 55% / 0.65);
			}
		}
		/* Around the button pressed and held, or dragged off: its options on a faint ring, each at
		   its own angle (--angle), the one dragged toward lit */
		.radial {
			inset: auto;
			margin: 0;
			padding: 0;
			width: 0;
			height: 0;
			overflow: visible;
			border: none;
			background: none;
			color: inherit;
		}
		.radial::before {
			content: "";
			position: absolute;
			width: calc(2 * var(--reach));
			aspect-ratio: 1;
			translate: -50% -50%;
			border-radius: 50%;
			border: 2px solid rgba(232, 220, 216, 0.08);
		}
		.radial button {
			position: absolute;
			translate: calc(cos(var(--angle)) * var(--reach) - 50%) calc(sin(var(--angle)) * var(--reach) - 50%);
			white-space: nowrap;
			background: #1d1717;
			box-shadow: 0 1vmin 4vmin rgba(0, 0, 0, 0.6);
			transition: scale 0.1s, background 0.1s;
		}
		.radial button.chosen {
			scale: 1.12;
			background: #4a3a39;
		}
		/* A bin: deleting a recording is for good */
		.bin {
			display: grid;
			place-items: center;
			padding: 0.45rem 0.6rem;
			color: hsl(3 90% 72%);
		}
		.bin svg {
			width: 1.1em;
			height: 1.1em;
		}
		.choices {
			display: flex;
			gap: 1rem;
		}
	</style>
	<script src="sounds.js"></script>
	<script src="saved.js"></script>
	<script type="module" src="home.js"></script>
</head>
<body>
	<main class="sounds"></main>
	<section class="recent" hidden>
		<h2>RECENT</h2>
		<ol class="recordings"></ol>
	</section>
	<template class="recording">
		<li><button class="play" aria-label="Play">&#9654;</button><span class="when"></span><button class="promote">PROMOTE</button><button class="save">SAVE MP3</button><button class="bin" aria-label="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 13h12l1-13M9 7V4h6v3"/></svg></button></li>
	</template>
	<!-- Pinned to the bottom: add a sound from a file, record one, or add one from the web -->
	<nav class="bar">
		<button class="from-file">ADD FILE</button>
		<span class="divider"></span>
		<button class="record" aria-label="Hold to record"></button>
		<span class="divider"></span>
		<button class="from-web">ADD URL</button>
		<input type="file" accept="audio/*" hidden>
	</nav>
	<div class="radial" popover="manual"></div>
	<!-- Naming a button and picking its color, to promote a sound or rename a button -->
	<dialog class="naming">
		<form method="dialog">
			<span class="sound preview"></span>
			<input name="hue" type="range" min="0" max="359" aria-label="Color">
			<input name="name" placeholder="NAME" maxlength="20" required autocomplete="off">
			<div class="choices"><button type="button" class="cancel">CANCEL</button><button value="confirm" class="confirm"></button></div>
		</form>
	</dialog>
	<dialog class="fetching">
		<form>
			<input name="url" type="url" placeholder="https://" required autocomplete="off">
			<p class="problem" hidden></p>
			<div class="choices"><button type="button" class="cancel">CANCEL</button><button>ADD</button></div>
		</form>
	</dialog>
</body>
</html>
