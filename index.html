<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Soundboard</title>
	<meta name="theme-color" content="#141010">
	<!-- Its manifest scopes it to this page alone: claiming the whole folder, it would take in every
	     sound's folder below, and phones would refuse to install the sounds as apps of their own -->
	<link rel="manifest" href="manifest.webmanifest">
	<link rel="icon" href="icon-192.png">
	<link rel="apple-touch-icon" href="apple-touch-icon.png">
	<style>
		@font-face {
			font-family: OpenDyslexic;
			font-weight: 700;
			src: url(fonts/OpenDyslexic-Bold.woff);
		}
		body {
			margin: 0;
			min-height: 100vh;
			box-sizing: border-box;
			padding: 8vmin;
			/* Room for the bar pinned to the bottom */
			padding-bottom: calc(8vmin + 5.5rem);
			display: grid;
			/* As wide as the screen, however long a recording's row would like to be */
			grid-template-columns: minmax(0, 1fr);
			align-content: center;
			justify-items: center;
			gap: 12vmin;
			background: #141010;
			color: #e8dcd8;
			font: 700 1.08rem OpenDyslexic, sans-serif;
			letter-spacing: 0.02em;
		}
		.sounds {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 8vmin;
		}
		.sound {
			display: grid;
			justify-items: center;
			gap: 1.2rem;
			color: hsl(var(--hue) 70% 82%);
			font-size: 0.95em;
			text-decoration: none;
			-webkit-tap-highlight-color: transparent;
			/* Pressing and holding opens this page's own options, not the phone's menu or a text selection */
			-webkit-touch-callout: none;
			-webkit-user-select: none;
			user-select: none;
			/* Dragging off a button chooses from its options, rather than scrolling the page */
			touch-action: none;
		}
		/* A small copy of the sound's button, in its color */
		.sound::before {
			content: "";
			width: min(30vmin, 140px);
			aspect-ratio: 1;
			border-radius: 50%;
			background: radial-gradient(circle at 38% 32%, hsl(var(--hue) 100% 68%), hsl(var(--hue) 83% 46%) 45%, hsl(var(--hue) 89% 30%) 100%);
			box-shadow: 0 1vmin 0 hsl(var(--hue) 94% 18%), 0 2vmin 4vmin rgba(0, 0, 0, 0.6), inset 0 -0.6vmin 2vmin rgba(0, 0, 0, 0.35);
		}
		.recent {
			width: min(100%, 34rem);
			font-size: 0.765rem;
		}
		.recent h2 {
			margin: 0 0 1rem;
			font-size: inherit;
			letter-spacing: 0.12em;
			color: #8a7d7a;
		}
		.recordings {
			margin: 0;
			padding: 0;
			list-style: none;
			display: grid;
			grid-template-columns: minmax(0, 1fr);
			gap: 0.6rem;
		}
		.recordings li {
			display: flex;
			align-items: center;
			gap: 0.45rem;
			padding: 0.6rem 0.8rem;
			border-radius: 0.8rem;
			background: #1d1717;
		}
		/* The time a recording was made, at its own size, on one line however narrow the screen */
		.when {
			flex: 1;
			min-width: 0;
			overflow: hidden;
			white-space: nowrap;
			text-overflow: ellipsis;
			font-size: 0.85rem;
			color: #b3a5a1;
		}
		button {
			font: inherit;
			letter-spacing: inherit;
			color: inherit;
			background: #2c2323;
			border: none;
			border-radius: 999px;
			padding: 0.45rem 0.9rem;
			cursor: pointer;
			text-decoration: none;
		}
		dialog {
			border: none;
			border-radius: 1.2rem;
			padding: 2rem 2.4rem;
			background: #1d1717;
			color: inherit;
		}
		dialog::backdrop {
			background: rgba(0, 0, 0, 0.65);
		}
		dialog form {
			display: grid;
			justify-items: center;
			gap: 1.4rem;
		}
		dialog input:not([type="range"]) {
			width: 12rem;
			padding: 0.5rem 0.8rem;
			border: 2px solid #3a2f2e;
			border-radius: 0.6rem;
			background: #141010;
			color: inherit;
			font: inherit;
			text-align: center;
		}
		dialog input[name="name"] {
			text-transform: uppercase;
		}
		/* The color, picked off a rainbow */
		dialog input[type="range"] {
			appearance: none;
			width: 14rem;
			height: 0.8rem;
			border-radius: 999px;
			background: linear-gradient(to right, hsl(0 85% 50%), hsl(60 85% 50%), hsl(120 85% 50%), hsl(180 85% 50%), hsl(240 85% 50%), hsl(300 85% 50%), hsl(360 85% 50%));
		}
		dialog input[type="range"]::-webkit-slider-thumb {
			appearance: none;
			width: 1.5rem;
			aspect-ratio: 1;
			border-radius: 50%;
			background: #e8dcd8;
		}
		dialog input[type="range"]::-moz-range-thumb {
			width: 1.5rem;
			height: 1.5rem;
			border: none;
			border-radius: 50%;
			background: #e8dcd8;
		}
		.fetching {
			width: min(28rem, 88vw);
			box-sizing: border-box;
		}
		.fetching input[name="url"] {
			width: 100%;
			box-sizing: border-box;
		}
		/* The sounds found on a page, to play and add */
		.found {
			width: 100%;
			max-height: 45vh;
			overflow-y: auto;
			margin: 0;
			padding: 0;
			list-style: none;
			display: grid;
			grid-template-columns: minmax(0, 1fr);
			gap: 0.4rem;
			font-size: 0.8rem;
		}
		.found:empty {
			display: none;
		}
		.found li {
			display: flex;
			align-items: center;
			gap: 0.5rem;
		}
		.found .name {
			flex: 1;
			min-width: 0;
			overflow: hidden;
			white-space: nowrap;
			text-overflow: ellipsis;
		}
		.found .length {
			color: #8a7d7a;
		}
		/* Too long to add, though it can still be played */
		.found .add.too-long {
			opacity: 0.35;
		}
		.problem {
			max-width: 16rem;
			margin: 0;
			text-align: center;
			font-size: 0.72rem;
			color: hsl(3 90% 72%);
		}
		/* The red dot in the middle, its two sides as wide as the wider of them */
		.bar {
			position: fixed;
			left: 50%;
			bottom: max(1.2rem, env(safe-area-inset-bottom));
			translate: -50% 0;
			/* Its own width, not squeezed into the half of the screen right of where it's placed */
			width: max-content;
			display: grid;
			grid-template-columns: 1fr auto auto auto 1fr;
			align-items: center;
			gap: 0.8rem;
			font-size: 0.72rem;
			white-space: nowrap;
		}
		.bar button {
			color: #b3a5a1;
		}
		.from-file {
			justify-self: end;
		}
		.from-web {
			justify-self: start;
		}
		.divider {
			width: 2px;
			height: 1.6rem;
			border-radius: 1px;
			background: rgba(232, 220, 216, 0.12);
		}
		/* A studio's red dot, held to record */
		.record {
			position: relative;
			width: 3.6rem;
			aspect-ratio: 1;
			padding: 0;
			border-radius: 50%;
			background: radial-gradient(circle closest-side, hsl(3 85% 52%) 60%, #2c2323 63%);
			touch-action: none;
			-webkit-touch-callout: none;
		}
		/* While recording, an arc over the dot, wide enough to show round a thumb (four of the dot's
		   radii out), fills from left to right with the time used (--taken). It passes behind the
		   buttons either side, its ends hidden under them */
		.taken {
			position: absolute;
			z-index: -1;
			left: 50%;
			top: 50%;
			width: calc(8 * 1.8rem);
			translate: -50% -50%;
			overflow: visible;
			pointer-events: none;
			opacity: 0;
			transition: opacity 0.2s;
		}
		.recording .taken {
			opacity: 1;
		}
		.taken path {
			fill: none;
			stroke-width: 3;
			stroke-linecap: round;
		}
		.taken .track {
			stroke: rgba(232, 220, 216, 0.14);
		}
		.taken .used {
			stroke: hsl(3 90% 62%);
			stroke-dasharray: 1;
			stroke-dashoffset: calc(1 - var(--taken, 0));
		}
		.record.recording {
			animation: listening 0.8s ease-in-out infinite alternate;
		}
		@keyframes listening {
			to {
				box-shadow: 0 0 1.6rem hsl(3 90% 55% / 0.65);
			}
		}
		/* The wheel round a button pressed and held, or dragged off: the page blurred behind, the
		   button's options in equal slices of a ring round it, each a picture, the one pulled toward
		   lit in the button's color (--hue) and named in the middle */
		.wheel {
			inset: 0;
			width: auto;
			height: auto;
			margin: 0;
			padding: 0;
			overflow: visible;
			border: none;
			color: inherit;
			background: rgba(10, 8, 8, 0.35);
			-webkit-backdrop-filter: blur(6px);
			backdrop-filter: blur(6px);
			opacity: 0;
			transition: opacity 0.12s, display 0.12s allow-discrete, overlay 0.12s allow-discrete;
		}
		.wheel:popover-open {
			opacity: 1;
		}
		.wheel svg, .wheel .named {
			position: absolute;
			translate: -50% -50%;
			scale: 0.85;
			transition: scale 0.12s cubic-bezier(0.3, 1.4, 0.5, 1);
		}
		.wheel:popover-open svg, .wheel:popover-open .named {
			scale: 1;
		}
		@starting-style {
			.wheel:popover-open {
				opacity: 0;
			}
			.wheel:popover-open svg, .wheel:popover-open .named {
				scale: 0.85;
			}
		}
		.wheel svg {
			overflow: visible;
		}
		.slice {
			fill: rgba(29, 23, 23, 0.88);
			stroke: rgba(232, 220, 216, 0.1);
			transition: fill 0.08s;
		}
		.slice.chosen {
			fill: hsl(var(--hue) 55% 36%);
		}
		.hole {
			fill: rgba(20, 16, 16, 0.6);
		}
		.picture {
			fill: none;
			stroke: #e8dcd8;
			stroke-width: 2;
			stroke-linecap: round;
			stroke-linejoin: round;
			pointer-events: none;
		}
		.wheel .named {
			width: 7rem;
			text-align: center;
			font-size: 0.87em;
			pointer-events: none;
		}
		/* Buttons that are just a picture: play, promote, save, bin */
		.icon {
			display: grid;
			place-items: center;
			padding: 0.45rem 0.55rem;
		}
		.icon svg {
			width: 1.15em;
			height: 1.15em;
			fill: none;
			stroke: currentColor;
			stroke-width: 2.2;
			stroke-linecap: round;
			stroke-linejoin: round;
		}
		/* Deleting a recording is for good */
		.bin {
			color: hsl(3 90% 72%);
		}
		.choices {
			display: flex;
			gap: 1rem;
		}
	</style>
	<script src="sounds.js"></script>
	<script src="saved.js"></script>
	<script type="module" src="home.js"></script>
</head>
<body>
	<main class="sounds"></main>
	<section class="recent" hidden>
		<h2>RECENT</h2>
		<ol class="recordings"></ol>
	</section>
	<template class="recording">
		<li>
			<button class="icon play" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg></button>
			<span class="when"></span>
			<button class="icon promote" aria-label="Promote to a button"><svg viewBox="0 0 24 24"><path d="M6 18l6-6 6 6M6 11l6-6 6 6"/></svg></button>
			<button class="icon save" aria-label="Save as an MP3"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6"/></svg></button>
			<button class="icon bin" aria-label="Delete"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 13h12l1-13M9 7V4h6v3"/></svg></button>
		</li>
	</template>
	<template class="found-sound">
		<li>
			<button type="button" class="icon play" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg></button>
			<span class="name"></span>
			<span class="length"></span>
			<button type="button" class="add">ADD</button>
			<audio preload="metadata"></audio>
		</li>
	</template>
	<!-- Pinned to the bottom: add a sound from a file, record one, or add one from the web -->
	<nav class="bar">
		<button class="from-file">ADD FILE</button>
		<span class="divider"></span>
		<button class="record" aria-label="Hold to record"><svg class="taken" viewBox="-100 -100 200 200"><path class="track" d="M -100 0 A 100 100 0 0 1 100 0" pathLength="1"/><path class="used" d="M -100 0 A 100 100 0 0 1 100 0" pathLength="1"/></svg></button>
		<span class="divider"></span>
		<button class="from-web">ADD FROM URL</button>
		<input type="file" accept="audio/*" hidden>
	</nav>
	<div class="wheel" popover="manual"></div>
	<!-- Naming a button and picking its color, to promote a sound or rename a button -->
	<dialog class="naming">
		<form method="dialog">
			<span class="sound preview"></span>
			<input name="hue" type="range" min="0" max="359" aria-label="Color">
			<input name="name" placeholder="NAME" maxlength="20" required autocomplete="off">
			<div class="choices"><button type="button" class="cancel">CANCEL</button><button value="confirm" class="confirm"></button></div>
		</form>
	</dialog>
	<dialog class="fetching">
		<form>
			<input name="url" type="url" placeholder="A sound, or a page with sounds on it" required autocomplete="off">
			<p class="problem" hidden></p>
			<ol class="found"></ol>
			<div class="choices"><button type="button" class="cancel">CANCEL</button><button>FETCH</button></div>
		</form>
	</dialog>
</body>
</html>
