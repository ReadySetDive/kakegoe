<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Soundboard</title>
	<meta name="theme-color" content="#141010">
	<!-- No manifest: an app installed from here would claim every sound's folder below, and phones
	     would then refuse to install the sounds as apps of their own -->
	<style>
		@font-face {
			font-family: OpenDyslexic;
			font-weight: 700;
			src: url(fonts/OpenDyslexic-Bold.woff);
		}
		body {
			margin: 0;
			min-height: 100vh;
			box-sizing: border-box;
			padding: 8vmin;
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			align-content: center;
			gap: 8vmin;
			background: #141010;
			font: 700 1.2rem OpenDyslexic, sans-serif;
			letter-spacing: 0.02em;
		}
		.sound {
			display: grid;
			justify-items: center;
			gap: 1.2rem;
			color: hsl(var(--hue) 70% 82%);
			text-decoration: none;
			-webkit-tap-highlight-color: transparent;
		}
		/* A small copy of the sound's button, in its color */
		.sound::before {
			content: "";
			width: min(30vmin, 140px);
			aspect-ratio: 1;
			border-radius: 50%;
			background: radial-gradient(circle at 38% 32%, hsl(var(--hue) 100% 68%), hsl(var(--hue) 83% 46%) 45%, hsl(var(--hue) 89% 30%) 100%);
			box-shadow: 0 1vmin 0 hsl(var(--hue) 94% 18%), 0 2vmin 4vmin rgba(0, 0, 0, 0.6), inset 0 -0.6vmin 2vmin rgba(0, 0, 0, 0.35);
		}
	</style>
	<script src="sounds.js"></script>
</head>
<body>
	<script>
		for (const { folder, name, hue } of SOUNDS) {
			document.body.insertAdjacentHTML("beforeend", `<a class="sound" href="${folder}/" style="--hue: ${hue}">${name}</a>`)
		}
		navigator.serviceWorker?.register("sw.js")
	</script>
</body>
</html>
