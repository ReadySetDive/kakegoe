<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
	<title>Kakegoe</title>
	<meta name="theme-color" content="#141010">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Kakegoe">
	<link rel="manifest" href="manifest.webmanifest">
	<link rel="icon" href="icon-192.png">
	<link rel="apple-touch-icon" href="apple-touch-icon.png">
	<style>
		html, body {
			margin: 0;
			height: 100%;
			background: #141010;
			overflow: hidden;
			/* No zoom, selection or long-press menus when tapping fast */
			touch-action: manipulation;
			user-select: none;
			-webkit-user-select: none;
			-webkit-touch-callout: none;
			-webkit-tap-highlight-color: transparent;
		}
		body {
			display: grid;
			place-items: center;
		}
		button {
			width: min(62vmin, 340px);
			aspect-ratio: 1;
			border-radius: 50%;
			border: none;
			cursor: pointer;
			background: radial-gradient(circle at 38% 32%, #ff6a5c, #d81e14 45%, #8f0d08 100%);
			box-shadow: 0 1.6vmin 0 #5a0603, 0 3vmin 6vmin rgba(0, 0, 0, 0.6), inset 0 -1vmin 3vmin rgba(0, 0, 0, 0.35);
			position: relative;
			touch-action: none;
			transform: perspective(90vmin) rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateY(var(--sink, 0vmin)) scale(var(--squeeze, 1));
			/* Released, it springs back with a little overshoot */
			transition: transform 0.35s cubic-bezier(0.3, 1.6, 0.5, 1), box-shadow 60ms;
		}
		button.pressed {
			--sink: 1.2vmin;
			--squeeze: 0.97;
			transition: transform 60ms, box-shadow 60ms;
			box-shadow: 0 0.4vmin 0 #5a0603, 0 1.5vmin 3vmin rgba(0, 0, 0, 0.6), inset 0 -0.5vmin 2vmin rgba(0, 0, 0, 0.45);
		}
		/* Tilting follows the finger closely while the middle is held and dragged */
		button.bending {
			transition: transform 40ms linear, box-shadow 60ms;
		}
		/* The knob's marker: a dimple near the rim, turned by rotating this full-size layer */
		.dial {
			position: absolute;
			inset: 0;
			pointer-events: none;
			transform: rotate(var(--turn, 0deg));
		}
		.dot {
			position: absolute;
			top: 50%;
			right: 6%;
			width: 9%;
			aspect-ratio: 1;
			translate: 0 -50%;
			border-radius: 50%;
			/* A shallow dimple pressed into the button: shaded at its top, catching light at its
			   bottom. Counter-rotated so that light keeps coming from above as the knob turns */
			rotate: calc(var(--turn, 0deg) * -1);
			background: radial-gradient(circle at 50% 65%, #c71a10, #a8130b);
			box-shadow: inset 0 0.5vmin 0.8vmin rgba(60, 0, 0, 0.45), inset 0 -0.3vmin 0.4vmin rgba(255, 120, 100, 0.25);
			pointer-events: auto;
			cursor: grab;
			touch-action: none;
		}
		/* A fingertip-sized grab area around the small dot */
		.dot::before {
			content: "";
			position: absolute;
			inset: -120%;
			border-radius: 50%;
		}
		.dot:active {
			cursor: grabbing;
		}
	</style>
</head>
<body>
	<button aria-label="Yoooo! (play the call)"><span class="dial"><span class="dot" title="Drag to change pitch"></span></span></button>
	<script type="module">
		// Lets iPhones play it even with the ring/silent switch on silent
		if (navigator.audioSession) navigator.audioSession.type = "playback"

		const button = document.querySelector("button")
		const dial = document.querySelector(".dial")
		const dot = document.querySelector(".dot")

		// The knob turns 150 degrees either way from 3 o'clock: up an octave at the top, down one at the bottom
		const KNOB_LIMIT = 150
		// Within this many degrees of 3 o'clock the knob is drawn softly back to normal pitch
		const DETENT = 12
		const WHEEL_DEGREES_PER_PIXEL = 0.1 // a wheel notch (about 100 px) turns the knob 10 degrees
		// Pressing within this share of the diameter, measured from the centre, also bends the call;
		// dragging this share of the radius away from the press reaches the bend's limits
		const BEND_ZONE = 0.78
		const BEND_REACH = 0.6
		const TILT_DEGREES = 8

		const audio = new AudioContext()
		const volume = audio.createGain()
		// Many overlapping calls at up to 1.5x volume would clip; this holds them just under full scale
		const limiter = new DynamicsCompressorNode(audio, { threshold: -3, knee: 0, ratio: 20, attack: 0.002, release: 0.1 })
		// Every press becomes a voice in one granular player (voices.js), so pitch and speed bend
		// independently, live, on every call already sounding
		const voices = audio.audioWorklet.addModule("voices.js").then(async () => {
			const node = new AudioWorkletNode(audio, "voices", { outputChannelCount: [2] })
			const call = await audio.decodeAudioData(await (await fetch("yo.mp3")).arrayBuffer())
			const channels = Array.from({ length: call.numberOfChannels }, (_, channel) => call.getChannelData(channel))
			node.port.postMessage({ channels })
			node.connect(volume).connect(limiter).connect(audio.destination)
			return node
		})

		let hand = 0 // degrees the knob has been turned to (positive is anticlockwise), before the detent eases it
		let bending = null // the pointer holding the middle of the button, and where it pressed
		const held = new Set() // pointers currently holding the button or the knob

		async function play() {
			// Browsers only allow sound after a touch, so wake the audio on the press itself
			if (audio.state !== "running") audio.resume()
			const node = await voices
			node.port.postMessage("play")
		}

		async function glide(parameter, value) {
			const node = await voices
			node.parameters.get(parameter).setTargetAtTime(value, audio.currentTime, 0.02)
		}

		function turnKnob(degrees) {
			hand = Math.max(-KNOB_LIMIT, Math.min(KNOB_LIMIT, degrees))
			// Eases to zero near the centre, so dwelling close to normal settles there, while
			// matching the hand exactly at the detent's edge so there is never a jump
			const knob = Math.abs(hand) < DETENT ? hand * (hand / DETENT) ** 2 : hand
			dial.style.setProperty("--turn", `${-knob}deg`)
			glide("pitch", 2 ** (knob / KNOB_LIMIT))
		}

		// across: -1 (dragged fully left) .. 1 (right); down: -1 (fully up) .. 1 (down)
		function bend(across, down) {
			// The button tips toward the drag, as if pressed off-centre
			button.style.setProperty("--tilt-x", `${-down * TILT_DEGREES}deg`)
			button.style.setProperty("--tilt-y", `${across * TILT_DEGREES}deg`)
			glide("speed", across < 0 ? 1 + across * 0.8 : 1 + across * 0.75) // 0.2x .. 1.75x
			volume.gain.setTargetAtTime(down < 0 ? 1 - down * 0.5 : 1 - down * 0.8, audio.currentTime, 0.02) // 1.5x .. 0.2x
		}

		function centre() {
			const box = button.getBoundingClientRect()
			return { x: box.left + box.width / 2, y: box.top + box.height / 2, radius: box.width / 2 }
		}

		dot.addEventListener("pointerdown", (event) => {
			// Grabbing the dot turns the knob instead of pressing the button
			event.stopPropagation()
			event.preventDefault()
			dot.setPointerCapture(event.pointerId)
			held.add(event.pointerId)
		})
		dot.addEventListener("pointermove", (event) => {
			if (!dot.hasPointerCapture(event.pointerId)) return
			const { x, y } = centre()
			turnKnob(Math.atan2(y - event.clientY, event.clientX - x) * 180 / Math.PI)
		})

		// On press rather than click: the sound starts the instant a finger lands
		button.addEventListener("pointerdown", (event) => {
			event.preventDefault()
			button.setPointerCapture(event.pointerId)
			held.add(event.pointerId)
			button.classList.add("pressed")
			play()
			const { x, y, radius } = centre()
			if (!bending && Math.hypot(event.clientX - x, event.clientY - y) < radius * BEND_ZONE) {
				bending = { pointerId: event.pointerId, x: event.clientX, y: event.clientY, reach: radius * BEND_REACH }
				button.classList.add("bending")
			}
		})
		button.addEventListener("pointermove", (event) => {
			if (event.pointerId !== bending?.pointerId) return
			const limit = (value) => Math.max(-1, Math.min(1, value))
			bend(limit((event.clientX - bending.x) / bending.reach), limit((event.clientY - bending.y) / bending.reach))
		})
		for (const release of ["pointerup", "pointercancel"]) {
			button.addEventListener(release, (event) => {
				held.delete(event.pointerId)
				if (held.size === 0) button.classList.remove("pressed")
				if (event.pointerId === bending?.pointerId) {
					// Let go and the button springs back flat, the call back to normal speed and volume
					bending = null
					button.classList.remove("bending")
					bend(0, 0)
				}
			})
		}
		button.addEventListener("keydown", (event) => {
			if (event.key === " " || event.key === "Enter") {
				event.preventDefault()
				play()
			}
		})
		button.addEventListener("contextmenu", (event) => event.preventDefault())

		let unpress
		button.addEventListener("wheel", (event) => {
			event.preventDefault()
			// While the button is held down, the wheel turns the pitch knob instead of pressing
			if (held.size) {
				const pixels = event.deltaMode === WheelEvent.DOM_DELTA_LINE ? event.deltaY * 33 : event.deltaY
				turnKnob(hand - pixels * WHEEL_DEGREES_PER_PIXEL)
				return
			}
			// Otherwise every notch of a mouse wheel is a press. A notch arrives as one big jump (a
			// line, or about 100 px); touchpads send streams of small deltas, which are ignored
			if (event.deltaMode === WheelEvent.DOM_DELTA_PIXEL && Math.abs(event.deltaY) < 40) return
			play()
			button.classList.add("pressed")
			clearTimeout(unpress)
			unpress = setTimeout(() => held.size || button.classList.remove("pressed"), 60)
		}, { passive: false })

		navigator.serviceWorker?.register("sw.js")
	</script>
</body>
</html>
