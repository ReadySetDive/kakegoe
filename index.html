<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Soundboard</title>
	<meta name="theme-color" content="#141010">
	<!-- No manifest: an app installed from here would claim every sound's folder below, and phones
	     would then refuse to install the sounds as apps of their own -->
	<style>
		@font-face {
			font-family: OpenDyslexic;
			font-weight: 700;
			src: url(fonts/OpenDyslexic-Bold.woff);
		}
		body {
			margin: 0;
			min-height: 100vh;
			box-sizing: border-box;
			padding: 8vmin;
			display: grid;
			align-content: center;
			justify-items: center;
			gap: 12vmin;
			background: #141010;
			color: #e8dcd8;
			font: 700 1.2rem OpenDyslexic, sans-serif;
			letter-spacing: 0.02em;
		}
		.sounds {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 8vmin;
		}
		.sound {
			display: grid;
			justify-items: center;
			gap: 1.2rem;
			color: hsl(var(--hue) 70% 82%);
			text-decoration: none;
			-webkit-tap-highlight-color: transparent;
			/* Pressing and holding opens this page's own menu, not the phone's or a text selection */
			-webkit-touch-callout: none;
			-webkit-user-select: none;
			user-select: none;
		}
		/* A small copy of the sound's button, in its color */
		.sound::before {
			content: "";
			width: min(30vmin, 140px);
			aspect-ratio: 1;
			border-radius: 50%;
			background: radial-gradient(circle at 38% 32%, hsl(var(--hue) 100% 68%), hsl(var(--hue) 83% 46%) 45%, hsl(var(--hue) 89% 30%) 100%);
			box-shadow: 0 1vmin 0 hsl(var(--hue) 94% 18%), 0 2vmin 4vmin rgba(0, 0, 0, 0.6), inset 0 -0.6vmin 2vmin rgba(0, 0, 0, 0.35);
		}
		.recent {
			width: min(100%, 34rem);
			font-size: 0.85rem;
		}
		.recent h2 {
			margin: 0 0 1rem;
			font-size: inherit;
			letter-spacing: 0.12em;
			color: #8a7d7a;
		}
		.recordings {
			margin: 0;
			padding: 0;
			list-style: none;
			display: grid;
			gap: 0.6rem;
		}
		.recordings li {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: 0.7rem;
			padding: 0.6rem 0.8rem;
			border-radius: 0.8rem;
			background: #1d1717;
		}
		.when {
			flex: 1;
			color: #b3a5a1;
		}
		button, .save {
			font: inherit;
			letter-spacing: inherit;
			color: inherit;
			background: #2c2323;
			border: none;
			border-radius: 999px;
			padding: 0.45rem 0.9rem;
			cursor: pointer;
			text-decoration: none;
		}
		.promoting {
			border: none;
			border-radius: 1.2rem;
			padding: 2rem 2.4rem;
			background: #1d1717;
			color: inherit;
		}
		.promoting::backdrop {
			background: rgba(0, 0, 0, 0.65);
		}
		.promoting form {
			display: grid;
			justify-items: center;
			gap: 1.4rem;
		}
		.promoting input[name="name"] {
			width: 12rem;
			padding: 0.5rem 0.8rem;
			border: 2px solid #3a2f2e;
			border-radius: 0.6rem;
			background: #141010;
			color: inherit;
			font: inherit;
			text-align: center;
			text-transform: uppercase;
		}
		/* The color, picked off a rainbow */
		.promoting input[type="range"] {
			appearance: none;
			width: 14rem;
			height: 0.8rem;
			border-radius: 999px;
			background: linear-gradient(to right, hsl(0 85% 50%), hsl(60 85% 50%), hsl(120 85% 50%), hsl(180 85% 50%), hsl(240 85% 50%), hsl(300 85% 50%), hsl(360 85% 50%));
		}
		.promoting input[type="range"]::-webkit-slider-thumb {
			appearance: none;
			width: 1.5rem;
			aspect-ratio: 1;
			border-radius: 50%;
			background: #e8dcd8;
		}
		.promoting input[type="range"]::-moz-range-thumb {
			width: 1.5rem;
			height: 1.5rem;
			border: none;
			border-radius: 50%;
			background: #e8dcd8;
		}
		/* Under the button pressed and held */
		.menu {
			inset: auto;
			margin: 0;
			translate: -50% 0;
			padding: 0.4rem;
			border: none;
			border-radius: 999px;
			background: #1d1717;
			color: inherit;
			box-shadow: 0 1vmin 4vmin rgba(0, 0, 0, 0.6);
		}
		/* A bin: deleting a recording is for good */
		.bin {
			display: grid;
			place-items: center;
			padding: 0.45rem 0.6rem;
			color: hsl(3 90% 72%);
		}
		.bin svg {
			width: 1.1em;
			height: 1.1em;
		}
		.choices {
			display: flex;
			gap: 1rem;
		}
	</style>
	<script src="sounds.js"></script>
	<script src="saved.js"></script>
	<script type="module" src="home.js"></script>
</head>
<body>
	<main class="sounds"></main>
	<section class="recent" hidden>
		<h2>RECENT</h2>
		<ol class="recordings"></ol>
	</section>
	<template class="recording">
		<li><button class="play" aria-label="Play">&#9654;</button><span class="when"></span><button class="promote">PROMOTE</button><a class="save">SAVE</a><button class="bin" aria-label="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 13h12l1-13M9 7V4h6v3"/></svg></button></li>
	</template>
	<div class="menu" popover="manual">
		<button class="demote">DEMOTE</button>
	</div>
	<dialog class="promoting">
		<form method="dialog">
			<span class="sound preview"></span>
			<input name="name" placeholder="NAME" maxlength="20" required autocomplete="off">
			<input name="hue" type="range" min="0" max="359" aria-label="Color">
			<div class="choices"><button value="cancel" formnovalidate>CANCEL</button><button value="promote">PROMOTE</button></div>
		</form>
	</dialog>
</body>
</html>
