<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
	<title>Kakegoe</title>
	<meta name="theme-color" content="#141010">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Kakegoe">
	<link rel="manifest" href="manifest.webmanifest">
	<link rel="icon" href="icon-192.png">
	<link rel="apple-touch-icon" href="apple-touch-icon.png">
	<style>
		html, body {
			margin: 0;
			height: 100%;
			background: #141010;
			overflow: hidden;
			/* No zoom, selection or long-press menus when tapping fast */
			touch-action: manipulation;
			user-select: none;
			-webkit-user-select: none;
			-webkit-touch-callout: none;
			-webkit-tap-highlight-color: transparent;
		}
		body {
			display: grid;
			place-items: center;
		}
		button {
			width: min(62vmin, 340px);
			aspect-ratio: 1;
			border-radius: 50%;
			border: none;
			cursor: pointer;
			background: radial-gradient(circle at 38% 32%, #ff6a5c, #d81e14 45%, #8f0d08 100%);
			box-shadow: 0 1.6vmin 0 #5a0603, 0 3vmin 6vmin rgba(0, 0, 0, 0.6), inset 0 -1vmin 3vmin rgba(0, 0, 0, 0.35);
			transition: transform 60ms, box-shadow 60ms;
			position: relative;
		}
		/* The knob's marker: a dot near the rim, turned by rotating this full-size layer */
		.dial {
			position: absolute;
			inset: 0;
			pointer-events: none;
			transform: rotate(var(--turn, 0deg));
		}
		.dot {
			position: absolute;
			top: 50%;
			right: 6%;
			width: 9%;
			aspect-ratio: 1;
			translate: 0 -50%;
			border-radius: 50%;
			/* A shallow dimple pressed into the button: shaded at its top, catching light at its
			   bottom. Counter-rotated so that light keeps coming from above as the knob turns */
			rotate: calc(var(--turn, 0deg) * -1);
			background: radial-gradient(circle at 50% 65%, #c71a10, #a8130b);
			box-shadow: inset 0 0.5vmin 0.8vmin rgba(60, 0, 0, 0.45), inset 0 -0.3vmin 0.4vmin rgba(255, 120, 100, 0.25);
			pointer-events: auto;
			cursor: grab;
			touch-action: none;
		}
		/* A fingertip-sized grab area around the small dot */
		.dot::before {
			content: "";
			position: absolute;
			inset: -120%;
			border-radius: 50%;
		}
		.dot:active {
			cursor: grabbing;
		}
		button.pressed {
			transform: translateY(1.2vmin) scale(0.97);
			box-shadow: 0 0.4vmin 0 #5a0603, 0 1.5vmin 3vmin rgba(0, 0, 0, 0.6), inset 0 -0.5vmin 2vmin rgba(0, 0, 0, 0.45);
		}
	</style>
</head>
<body>
	<button aria-label="Yoooo! (play the call)"><span class="dial"><span class="dot" title="Drag to change pitch"></span></span></button>
	<script type="module">
		// Lets iPhones play it even with the ring/silent switch on silent
		if (navigator.audioSession) navigator.audioSession.type = "playback"

		const button = document.querySelector("button")
		const dial = document.querySelector(".dial")
		const dot = document.querySelector(".dot")
		const audio = new AudioContext()
		const playing = new Set()
		// The knob turns 150 degrees either way from 3 o'clock: up an octave at the top, down one at the bottom
		const KNOB_LIMIT = 150
		let knob = 0 // degrees, positive turning up (anticlockwise)
		// Decoded once up front, so each press starts instantly and presses overlap freely
		const call = fetch("yo.mp3").then((response) => response.arrayBuffer()).then((bytes) => audio.decodeAudioData(bytes))

		async function play() {
			// Browsers only allow sound after a touch, so wake the audio on the press itself
			if (audio.state !== "running") audio.resume()
			const voice = audio.createBufferSource()
			voice.buffer = await call
			voice.playbackRate.value = pitch()
			voice.connect(audio.destination)
			voice.start()
			playing.add(voice)
			voice.onended = () => playing.delete(voice)
		}

		function pitch() {
			return 2 ** (knob / KNOB_LIMIT)
		}

		// Within this many degrees of 3 o'clock the knob is drawn softly back to normal pitch
		const DETENT = 12

		function turnKnob(degrees) {
			knob = Math.max(-KNOB_LIMIT, Math.min(KNOB_LIMIT, degrees))
			// Eases to zero near the centre, so dwelling close to normal settles there, while
			// matching the hand exactly at the detent's edge so there is never a jump
			if (Math.abs(knob) < DETENT) knob = knob * (knob / DETENT) ** 2
			dial.style.setProperty("--turn", `${-knob}deg`)
			// Calls already sounding bend with the knob too
			for (const voice of playing) voice.playbackRate.setTargetAtTime(pitch(), audio.currentTime, 0.01)
			try { localStorage.setItem("knob", knob) } catch {}
		}

		try { turnKnob(Number(localStorage.getItem("knob")) || 0) } catch {}

		dot.addEventListener("pointerdown", (event) => {
			// Grabbing the dot turns the knob instead of pressing the button
			event.stopPropagation()
			event.preventDefault()
			dot.setPointerCapture(event.pointerId)
		})
		dot.addEventListener("pointermove", (event) => {
			if (!dot.hasPointerCapture(event.pointerId)) return
			const centre = button.getBoundingClientRect()
			const x = event.clientX - (centre.left + centre.width / 2)
			const y = event.clientY - (centre.top + centre.height / 2)
			turnKnob(Math.atan2(-y, x) * 180 / Math.PI)
		})

		// On press rather than click: the sound starts the instant a finger lands
		button.addEventListener("pointerdown", (event) => {
			event.preventDefault()
			button.classList.add("pressed")
			play()
		})
		for (const release of ["pointerup", "pointercancel", "pointerleave"]) {
			button.addEventListener(release, () => button.classList.remove("pressed"))
		}
		button.addEventListener("keydown", (event) => {
			if (event.key === " " || event.key === "Enter") {
				event.preventDefault()
				play()
			}
		})
		button.addEventListener("contextmenu", (event) => event.preventDefault())

		// Every notch of a mouse wheel over the button is a press. A notch arrives as one big
		// jump (a line, or about 100 px); touchpads send streams of small deltas, which are ignored
		let unpress
		button.addEventListener("wheel", (event) => {
			event.preventDefault()
			if (event.deltaMode === WheelEvent.DOM_DELTA_PIXEL && Math.abs(event.deltaY) < 40) return
			play()
			button.classList.add("pressed")
			clearTimeout(unpress)
			unpress = setTimeout(() => button.classList.remove("pressed"), 60)
		}, { passive: false })

		navigator.serviceWorker?.register("sw.js")
	</script>
</body>
</html>
